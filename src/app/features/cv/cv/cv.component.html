<section class="cv-page">
  <div class="cv-shell">
    <div class="cv-main">
      <p class="cv-eyebrow">{{ 'cv.eyebrow' | transloco }}</p>

      <h1 class="cv-title">Kevin Montealegre Melo</h1>

      <p class="cv-lead">
        {{ 'cv.lead' | transloco }}
      </p>

      <div class="cv-actions" aria-label="Resume actions">
        <a class="cv-action-link" [href]="cvPdfPath" target="_blank" rel="noopener noreferrer">
          <mat-icon aria-hidden="true">open_in_new</mat-icon>
          <span>{{ 'cv.open' | transloco }}</span>
        </a>

        <a class="cv-action-link" [href]="cvPdfPath" download>
          <mat-icon aria-hidden="true">download</mat-icon>
          <span>{{ 'cv.download' | transloco }}</span>
        </a>
      </div>

      <mat-divider></mat-divider>

      <div class="cv-highlights">
      </div>
    </div>

    <mat-card class="cv-preview-card" appearance="outlined">
      <div class="cv-preview-frame">
        <iframe
          [src]="cvPdfPreviewUrl"
          title="Kevin Montealegre Resume PDF"
          loading="lazy"
        ></iframe>
      </div>
    </mat-card>
  </div>
</section>
